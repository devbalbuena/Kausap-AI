name: 🌐 Build & Deploy Flutter Web to Firebase

on:
  push:
    branches:
      - main  # Triggers automatically on every push to main

jobs:
  build_and_deploy:
    name: Build Flutter Web & Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the code ──────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Flutter (stable channel) ───────────────────────────────
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 3. Print Flutter version (for debugging) ──────────────────────────
      - name: 🔍 Flutter version info
        run: flutter --version
        working-directory: mobile

      # ── 4. Get Flutter dependencies ───────────────────────────────────────
      - name: 📦 Get Flutter dependencies
        run: flutter pub get
        working-directory: mobile

      # ── 5. Analyze code (non-fatal — won't block deploy on lint warnings) ─
      - name: 🔍 Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile
        continue-on-error: true

      # ── 6. Build Flutter Web ──────────────────────────────────────────────
      - name: 🔨 Build Flutter Web (Release)
        run: flutter build web --release --pwa-strategy none
        working-directory: mobile

      # ── 7. Upload Web Build Artifact ──────────────────────────────────────
      - name: 📦 Upload Web Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kausap-ai-web-release
          path: mobile/build/web
          retention-days: 7

      # ── 8. Deploy to Firebase Hosting (if Service Account has Hosting IAM) ─
      - name: 🚀 Deploy to Firebase Hosting (Action)
        id: deploy_action
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kausap-ai
          channelId: live
          entryPoint: mobile
