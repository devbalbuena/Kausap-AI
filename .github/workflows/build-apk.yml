name: 🚀 Build Android APK (Beta Testing)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Also allows manual triggering from GitHub UI

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the code ──────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java (required by Android Gradle) ───────────────────────
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Set up Flutter ─────────────────────────────────────────────────
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      # ── 4. Get dependencies ───────────────────────────────────────────────
      - name: 📦 Get Flutter dependencies
        run: flutter pub get
        working-directory: mobile

      # ── 5. Run code analysis (optional but good practice) ─────────────────
      - name: 🔍 Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: mobile
        continue-on-error: true  # Don't fail the build on lint warnings

      # ── 6. Build the APK ──────────────────────────────────────────────────
      - name: 🔨 Build Release APK
        run: flutter build apk --release --split-per-abi
        working-directory: mobile
        # --split-per-abi creates smaller APKs for each CPU architecture
        # Instead of one fat 100MB APK, you get 3 smaller ones (~30MB each)
        # For testing, use the arm64-v8a version (works on all modern Android phones)

      # ── 7. Rename APK with version & date for easy identification ─────────
      - name: 📝 Rename APK files
        run: |
          mkdir -p release-apks
          DATE=$(date +"%Y-%m-%d")
          BUILD_NUM=${{ github.run_number }}
          
          # Copy all split APKs with friendly names
          for apk in mobile/build/app/outputs/flutter-apk/*.apk; do
            filename=$(basename "$apk" .apk)
            cp "$apk" "release-apks/KausapAI-beta-v${BUILD_NUM}-${DATE}-${filename##*-}.apk"
          done
          
          ls -la release-apks/

      # ── 8. Upload APK as a downloadable artifact ──────────────────────────
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KausapAI-Beta-APK-Build-${{ github.run_number }}
          path: release-apks/*.apk
          retention-days: 30  # Keep the APK available for 30 days

      # ── 9. Create a GitHub Release with the APK attached ─────────────────
      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v${{ github.run_number }}
          name: "🧪 Beta Build #${{ github.run_number }}"
          body: |
            ## 📱 Kausap AI — Beta Build #${{ github.run_number }}
            
            **Built from:** `${{ github.sha }}` on `${{ github.ref_name }}`
            **Date:** ${{ github.event.head_commit.timestamp }}
            **Commit message:** ${{ github.event.head_commit.message }}
            
            ---
            
            ## 📥 How to Install on Android
            
            1. Download the APK file below (choose `arm64-v8a` for most modern Android phones)
            2. On your Android phone, go to **Settings → Security → Install Unknown Apps** and allow your browser or Files app to install APKs
            3. Open the downloaded file and tap **Install**
            4. Open **Kausap AI** from your home screen!
            
            > ⚠️ **This is a beta/testing build.** For testing purposes only.
            
            ---
            
            ## 📂 Which APK file to download?
            | File | Device Type |
            |------|-------------|
            | `arm64-v8a` ✅ | **Most Android phones** (2017+) — Download this one! |
            | `armeabi-v7a` | Older/budget Android phones |
            | `x86_64` | Android emulators / very rare devices |
            
          files: release-apks/*.apk
          draft: false
          prerelease: true  # Marks it as a pre-release (beta)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
