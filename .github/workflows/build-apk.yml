name: 🚀 Build Android APK (Beta Testing)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Also allows manual triggering from GitHub UI

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout the code ──────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java (required by Android Gradle) ───────────────────────
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 3. Set up Flutter (use 'any' channel stable to get latest stable) ─
      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'   # Always uses latest stable — avoids version not found errors
          cache: true

      # ── 4. Print Flutter version (for debugging) ──────────────────────────
      - name: 🔍 Flutter version info
        run: flutter --version
        working-directory: mobile

      # ── 5. Get dependencies ───────────────────────────────────────────────
      - name: 📦 Get Flutter dependencies
        run: flutter pub get
        working-directory: mobile

      # ── 6. Run code analysis ──────────────────────────────────────────────
      - name: 🔍 Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: mobile
        continue-on-error: true  # Don't fail the build on lint warnings

      # ── 6.5 Generate Debug Keystore (Required for CI Release Build) ───────
      - name: 🔑 Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      # ── 7. Build the APK ──────────────────────────────────────────────────
      - name: 🔨 Build Release APK
        run: flutter build apk --release --split-per-abi -v > flutter_build_log.txt 2>&1
        working-directory: mobile
        # --split-per-abi creates smaller APKs per CPU architecture
        # arm64-v8a = works on all modern Android phones (2017+)

      # ── 7.1 Upload Build Log (for debugging) ─────────────────────────────
      - name: 📤 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log-${{ github.run_number }}
          path: mobile/flutter_build_log.txt

      # ── 8. List built APKs (for debugging) ────────────────────────────────
      - name: 📋 List built APK files
        run: ls -la mobile/build/app/outputs/flutter-apk/

      # ── 9. Rename APKs with friendly names ────────────────────────────────
      - name: 📝 Rename APK files
        run: |
          mkdir -p release-apks
          DATE=$(date +"%Y-%m-%d")
          BUILD_NUM=${{ github.run_number }}

          for apk in mobile/build/app/outputs/flutter-apk/*.apk; do
            filename=$(basename "$apk" .apk)
            # Extract architecture from names like 'app-arm64-v8a-release'
            arch=${filename#app-}
            arch=${arch%-release}
            cp "$apk" "release-apks/KausapAI-beta-build${BUILD_NUM}-${DATE}-${arch}.apk"
          done

          echo "📦 APK files ready:"
          ls -la release-apks/

      # ── 10. Upload APK as downloadable artifact ────────────────────────────
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KausapAI-Beta-APK-Build-${{ github.run_number }}
          path: release-apks/*.apk
          retention-days: 30

      # ── 11. Create a GitHub Release with APK attached ─────────────────────
      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v${{ github.run_number }}
          name: "🧪 Beta Build #${{ github.run_number }}"
          body: |
            ## 📱 Kausap AI — Beta Build #${{ github.run_number }}

            **Built from commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Commit message:** ${{ github.event.head_commit.message }}

            ---

            ## 📥 How to Install on Android

            1. Download the **`arm64-v8a`** APK file below (works on all modern Android phones)
            2. On your Android phone: **Settings → Security → Install Unknown Apps** → Allow your browser/Files app
            3. Open the downloaded `.apk` file → tap **Install**
            4. Open **Kausap AI** 🎉

            > ⚠️ This is a **beta/testing build** — for internal testing only.

            ---

            ## 📂 Which APK to download?
            | File | When to use |
            |------|-------------|
            | `arm64-v8a` ✅ | **Download this one** — works on most Android phones (2017+) |
            | `armeabi-v7a` | Older or budget phones |
            | `x86_64` | Android emulators only |

          files: release-apks/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
